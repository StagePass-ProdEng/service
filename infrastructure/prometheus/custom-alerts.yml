groups:
  - name: CustomAlerts
    rules:
      # --- Availability ---
      - alert: WARNING-ServiceHealthCheckFailing
        expr: up{job="spring-prod-eng-app"} == 0
        for: 30s
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Service health check failing (instance {{ $labels.instance }})"
          description: "The spring-prod-eng-app target has been unreachable for more than 30 seconds.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CRITICAL-ServiceHardDown
        expr: up{job="spring-prod-eng-app"} == 0
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service is DOWN (instance {{ $labels.instance }})"
          description: "The application has been unreachable for more than 5 minutes. Immediate intervention required."


      # --- Performance ---
      - alert: WARNING-HighRequestLatency
        expr: rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m]) / rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High average request latency on {{ $labels.uri }}"
          description: "Average request latency exceeds 500ms over the last 5 minutes.\n  VALUE = {{ $value }}s\n  LABELS = {{ $labels }}"

      - alert: WARNING-HighContainerMemoryUsage
        expr: container_memory_usage_bytes{name=~".*prod-eng.*"} / container_spec_memory_limit_bytes{name=~".*prod-eng.*"} > 0.8
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory usage in container (instance {{ $labels.instance }})"
          description: "Container memory usage exceeds 80% of its limit.\n  VALUE = {{ $value | humanizePercentage }}\n  LABELS = {{ $labels }}"

      # --- Quality ---
      - alert: WARNING-HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          category: quality
        annotations:
          summary: "High error rate detected ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests are returning 5xx errors over the last 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: WARNING-SlowResponseTime
        expr: rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m]) / rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]) > 1
        for: 1m
        labels:
          severity: warning
          category: quality
        annotations:
          summary: "Slow response time detected on {{ $labels.uri }}"
          description: "Average response time exceeds 1 second over the last 5 minutes.\n  VALUE = {{ $value }}s\n  LABELS = {{ $labels }}"